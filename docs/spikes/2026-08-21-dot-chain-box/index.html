<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot chain — five looks for “.”</title>
<style>
  /* THE SHELL ONLY.  Each variant is its own page; what they share is the rig
     and the docked box, which is the point — the tabs differ by what `.' opens.
     `/' is identical in four of them; D, the picked one, has taken it for the
     filter stage's edit key, which `check.mjs' declares rather than hides. */
  :root{
    --mono:"JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,monospace;
    --bg:#FFFFFF; --fg:#000000; --mute:#667071; --border:#E3E6EA;
    --accent:#31769F; --surface:#F8F8FF;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --fg:#FFFFFF; --mute:#A4C2EB; --border:#2A2D3D;
      --accent:#4CB5F5; --surface:#21252B;
    }
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 var(--mono); display:flex; flex-direction:column;
  }
  header{flex:none; border-bottom:1px solid var(--border); background:var(--surface)}
  h1{margin:0; padding:10px 20px 0; font-size:13px; font-weight:600; letter-spacing:.02em}
  h1 small{font-weight:400; color:var(--mute); margin-left:8px}
  nav{display:flex; flex-wrap:wrap; padding:0 20px}
  nav a{
    font-size:12px; color:var(--mute); text-decoration:none;
    border-bottom:2px solid transparent; padding:10px 12px;
  }
  nav a:hover{color:var(--fg)}
  nav a[aria-current="page"]{color:var(--fg); border-bottom-color:var(--accent)}
  nav a:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  p.note{
    margin:0; padding:8px 20px; font-size:11px; color:var(--mute);
    border-bottom:1px solid var(--border); max-width:100ch;
  }
  p.note code,p.note kbd{font-size:11px}
  iframe{flex:1 1 auto; width:100%; border:0; display:block; min-height:0}
</style>
</head>
<body>
  <header>
    <h1>Dot chain <small>five looks for what “.” opens · ★ the picked one</small></h1>
    <nav id="tabs" aria-label="variants">
      <a href="#a" data-src="a-control.html">A · control</a>
      <a href="#b" data-src="b-plain-chain.html">B · plain chain</a>
      <a href="#c" data-src="c-ide-chain.html">C · ide chain</a>
      <a href="#d" data-src="d-stage-pills.html">D · stage pills ★</a>
      <a href="#e" data-src="e-echo-line.html">E · echo line</a>
    </nav>
  </header>
  <p class="note" id="note"></p>
  <iframe id="stage" title="variant"></iframe>

<script>
(() => {
  "use strict";
  const NOTE = {
    a: "The control: <kbd>.</kbd> opens the same field <kbd>/</kbd> opens, one step wider — "
     + "the whole flat grammar in one text box. A dot is a character in it, the three "
     + "shaping keys are two more rows in the same dropdown, and nothing on the screen "
     + "says a query has stages.",
    b: "<kbd>.</kbd> spawns a dot and the menu offers <code>filter</code> / <code>sort</code> / "
     + "<code>columns</code>. A taken call is spelled as plain text — dots and parens dim, "
     + "arguments in the page's ink. The smallest tab that still claims a query has STAGES.",
    c: "The editor look: the call name in the reserved word's own hue, a ghost argument "
     + "list in the empty parens, the caret landing between them, completion per stage "
     + "inside them, and a closed call collapsing to its first argument and a count.",
    d: "<b>The picked look.</b> A closed call LEAVES the box and lands on the chip strip "
     + "as a pill, so the chain reads left to right where the chips sit, and the strip "
     + "becomes the flat query grouped back into stages. Click a pill — or press "
     + "<kbd>/</kbd> for the filter one — to reopen its parens; the commit rewrites that "
     + "badge in place. <kbd>DEL</kbd> is the chain's own backspace: the latest badge, "
     + "whole, last in first out.",
    e: "C's entry, plus the proof: the flat <code>?q=</code> the chain is writing, echoed "
     + "live under the box in small mute type — what stands quiet, what the chain adds lit. "
     + "The chain writes; the line proves, before <kbd>RET</kbd>.",
  };
  const tabs = [...document.querySelectorAll("#tabs a")];
  const stage = document.getElementById("stage");
  const note = document.getElementById("note");

  function show(key) {
    const tab = tabs.find((t) => t.hash === "#" + key) || tabs[0];
    for (const t of tabs) {
      if (t === tab) t.setAttribute("aria-current", "page");
      else t.removeAttribute("aria-current");
    }
    note.innerHTML = NOTE[tab.hash.slice(1)] || "";
    const src = tab.dataset.src;
    if (stage.getAttribute("src") !== src) stage.setAttribute("src", src);
    stage.addEventListener("load", () => {
      try { stage.contentWindow.focus(); } catch (e) { /* another origin */ }
    }, { once: true });
  }

  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || "d");
})();
</script>
</body>
</html>
