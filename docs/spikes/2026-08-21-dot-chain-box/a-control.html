  /* THE CONTROL DRAWS NOTHING OF ITS OWN.  `.' opens the same field `/' opens,

<body>
  <h1>A · control
    <small>today: one flat box, and “.” is just a character in it</small></h1>
  <div id="stage"><div id="app"></div></div>
  <footer>
    <span><kbd>/</kbd> filter door · <kbd>.</kbd> whole grammar ·
      <kbd>TAB</kbd> complete · <kbd>RET</kbd> apply · <kbd>ESC</kbd> back ·
      <kbd>n</kbd><kbd>p</kbd> rows · <kbd>t</kbd> theme</span>
    <span id="truth"></span>
  </footer>
<script src="rig.js"></script>
<script>
(function () {
  RIG.mount({ look: { flat: true, klass: "v-a" } });
})();
