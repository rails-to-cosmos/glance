<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N · the tree has a column of its own</title>
<link rel="stylesheet" href="pane.css">
<style>
  /* K's collision answered by SEPARATION: the pane gives the tree a column the text
     never enters, and every connector steps half a cell further left, so the
     horizontal ends with air before the bullet rather than against it.  Costs a
     character of width and hides nothing. */
  /* THE GROUND HUE IS NOT AN INK, and the DIM one is PICKED rather than mixed:
     mixing gold toward the ground darkens it, and a darker yellow is brown.  Both
     dims drop CHROMA and keep the light, so what point carries stays yellow. */
  :root{--g-bar:var(--g-sel); --g-bar-dim:#F6E28C}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--g-bar:#FFC777; --g-bar-dim:#DCC489}
  }
  :root[data-theme="dark"]{--g-bar:#FFC777; --g-bar-dim:#DCC489}

  /* THE GUTTER: a character of pane padding the text never enters. */
  #mdoc{padding-left:calc(var(--g-doc-padx) + 1ch)}
  #mdoc .de.dat{background-color:transparent}
  #mdoc .de.dat:not(.d-comp) .de{background-color:transparent}

  #rails{position:absolute; inset:0; pointer-events:none}
  #rails i{position:absolute; display:block; background:none}
  /* A RUN: the branch passes this row and goes on below it. */
  /* THE BASE STROKE IS AUXILIARY: a hairline, and only what is LIT gains weight. */
  #rails i.run{width:1px; border-radius:1px;
    background:color-mix(in srgb, var(--g-fg) 14%, var(--g-bg))}
  #rails i.run.up,#rails i.run.at,#rails i.run.bad{width:2px}
  /* AN ELBOW: down to the line's middle, then right.  `.end' stops there. */
  #rails i.bend{
    border-left:1px solid color-mix(in srgb, var(--g-fg) 14%, var(--g-bg));
    border-bottom:1px solid color-mix(in srgb, var(--g-fg) 14%, var(--g-bg));
    border-radius:0 0 0 3px;
  }
  #rails i.bend.up,#rails i.bend.at,#rails i.bend.bad{border-width:2px}
  #rails i.up.run{background:color-mix(in srgb, var(--g-accent)
                                       calc(var(--near) * 1%), var(--g-bg))}
  #rails i.up.bend{border-color:color-mix(in srgb, var(--g-accent)
                                          calc(var(--near) * 1%), var(--g-bg))}
  #rails i.at.run{background:var(--g-bar)}
  #rails i.at.bend{border-color:var(--g-bar)}
  /* WHAT POINT CARRIES, IN THE SAME GOLD A SHADE BACK -- J's tier, which says the
     subtree belongs to the stop without competing with the line that IS it. */
  #rails i.rest.run{background:var(--g-bar-dim)}
  #rails i.rest.bend{border-color:var(--g-bar-dim)}
  #rails i.bad.run{background:var(--g-bad)}
  #rails i.bad.bend{border-color:var(--g-bad)}

  #path{
    position:sticky; top:calc(-1 * var(--g-doc-pady)); z-index:2;
    margin:calc(-1 * var(--g-doc-pady)) calc(-1 * var(--g-doc-padx)) 6px;
    padding:4px var(--g-doc-padx);
    background:var(--g-surface); border-bottom:1px solid var(--g-border);
    font-size:11px; color:var(--g-mute);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:1.4em;
  }
  #path span{color:color-mix(in srgb, var(--g-accent) calc(var(--near) * 1%),
                             var(--g-mute))}
  #path b{font-weight:600; color:var(--g-bar)}
  #path s{text-decoration:none; padding:0 5px; opacity:.6}
</style>
</head>
<body>
  <h1>N · the tree has a column of its own
    <small>one more character of padding, so a connector never sits next to a glyph</small></h1>
  <div id="mdoc" class="on"></div>
  <footer>
    <span><kbd>n</kbd><kbd>p</kbd> siblings · <kbd>f</kbd><kbd>b</kbd> in/out ·
      <kbd>t</kbd> theme · <kbd>d</kbd> flag</span>
    <span id="truth"></span>
  </footer>
<script src="rig.js"></script>
<script>
(function () {
  var layer, strip;
  var near = function (steps) { return Math.max(22, 100 - steps * 32); };
  var word = function (r) {
    if (r.el.classList.contains("d-comp")) return "list";
    var el = r.el.querySelector(".dp") || r.el;
    var t = el.textContent.replace(RIG.MARKER, "").trim();
    return t.length > 24 ? t.slice(0, 23) + "…" : t;
  };
  var STUB = 1.1;             // how far the elbow reaches, in characters
  var isItem = function (r) { return r.el.classList.contains("d-item"); };
  var colOf = function (r) { return isItem(r) ? r.depth * 2 : 0; };

  RIG.mount({
    setup: function (mdoc) {
      layer = document.createElement("div");
      layer.id = "rails";
      layer.setAttribute("aria-hidden", "true");
      mdoc.appendChild(layer);
      strip = document.createElement("div");
      strip.id = "path";
      mdoc.insertBefore(strip, mdoc.firstChild);
    },
    paint: function (s) {
      strip.textContent = "";
      var crumbs = s.chain.filter(function (r) {
        return r.el.classList.contains("d-item") || r.el.classList.contains("d-comp");
      });
      if (!crumbs.length) strip.textContent = "paragraph";
      else crumbs.forEach(function (r, i) {
        if (i) strip.appendChild(document.createElement("s")).textContent = "›";
        var last = i === crumbs.length - 1;
        var span = document.createElement(last ? "b" : "span");
        span.textContent = word(r);
        if (!last) span.style.setProperty("--near", near(crumbs.length - 1 - i));
        strip.appendChild(span);
      });

      var up = s.chain.slice(0, -1);
      layer.textContent = "";
      var put = function (cls, style) {
        var i = document.createElement("i");
        i.className = cls;
        i.style.cssText = style;
        layer.appendChild(i);
      };
      // The ink a row's own connector takes: point's own, a flag's, the ancestry's
      // step, or nothing at all.
      // A COMPOSITE HAS NO CONNECTOR OF ITS OWN, so standing on the list lights the
      // ROOTS it opens -- its own children -- and stops there.  Lighting every
      // descendant painted the pane gold and named no stop in particular.  An ITEM
      // lights itself alone, the rule the cursor's ground was given.
      var whole = s.at.el.classList.contains("d-comp");
      var carries = function (r) { return whole && r.up === s.at; };
      // EVERYTHING ELSE POINT HOLDS takes the muted gold: it belongs to the stop,
      // and it is not the stop.
      var carried = function (r) {
        for (var up = r.up; up; up = up.up) if (up === s.at) return true;
        return false;
      };
      var inkOf = function (r) {
        if (r.el.classList.contains("dfl")) return { cls: "bad", near: null };
        // WHAT POINT CARRIES IS POINT'S, to the bottom of it: a composite IS
        // everything under it, so standing on the list lights the whole tree.
        if (r === s.at || carries(r)) return { cls: "at", near: null };
        if (carried(r)) return { cls: "rest", near: null };
        // THE PATH, NOT THE LEVEL: a tree already draws the branch, so what is lit
        // is the ANCESTORS' own connectors -- lighting every sibling of every
        // ancestor lit three whole levels and said nothing about the way back.
        var rank = up.indexOf(r);
        return rank >= 0 ? { cls: "up", near: near(up.length - rank) } : { cls: "", near: null };
      };

      // A PARAGRAPH IS NOT A BRANCH: it has no children to elbow into, so it keeps
      // the vertical bar, at the one column every outermost row marks on.
      var bar = function (r) {
        var box = s.px(r.el);
        var ink = inkOf(r);
        put("run " + ink.cls,
            "left:" + (s.left - 2.5 * s.ch) + "px;top:" + box.top + "px;height:"
            + box.height + "px"
            + (ink.near === null ? "" : ";--near:" + ink.near));
      };

      var walk = function (kids, parent) {
        kids.forEach(function (r, i) {
          if (!isItem(r)) { if (!r.kids.length) bar(r); walk(r.kids, r); return; }
          var box = s.px(r.el);
          var own = s.px(r.el.querySelector(".dp"));
          // HALF A CELL FURTHER LEFT than the tab stop, which is the air.
          var x = s.left + (colOf(r) - 2.5) * s.ch;
          var mid = own.top + own.height / 2;
          var ink = inkOf(r);
          var tint = ink.near === null ? "" : ";--near:" + ink.near;
          // THE ELBOW: down from the row's top to the middle of its own line, then
          // right to where the text begins.
          // NO STUB: the tree's horizontal sat at the same height as org's own `-'
          // and one cell to its left, so the two read as one dashed run.  ORG'S
          // BULLET IS THE BRANCH'S TIP -- the connector turns and stops, and the
          // dash the file already carries finishes the reach.  `STUB' is the knob:
          // 0.45 of a character puts the horizontal back.
          put("bend " + ink.cls,
              "left:" + x + "px;top:" + box.top + "px;height:"
              + (mid - box.top) + "px;width:" + (s.ch * STUB) + "px" + tint);
          // THE RUN: a branch that has more to come carries on past this row.
          if (i < kids.length - 1) {
            put("run " + ink.cls,
                "left:" + x + "px;top:" + mid + "px;height:"
                + (box.top + box.height - mid) + "px" + tint);
          }
          walk(r.kids, r);
        });
      };
      // A BAR IS FOR A ROW THAT IS NOT A BRANCH.  A composite has children and is
      // drawn as the tree they make; drawing both said the same thing twice.
      s.rootsOf().forEach(function (r) {
        if (!isItem(r) && !r.kids.length && !r.el.classList.contains("d-head")) bar(r);
        walk(r.kids, r);
      });
    },
  });
})();
</script>
</body>
</html>
