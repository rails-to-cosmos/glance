<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G · the ancestry, drawn and named</title>
<link rel="stylesheet" href="pane.css">
<style>
  /* E AND F ARE THE SAME CHAIN SAID TWICE, so they take one ramp: a block's rail
     and its crumb carry the same strength, brightening inward to point.  The
     strip is then a legend for the rails and the rails are a picture of the
     strip, and neither has to be read on its own. */
  #rails{position:absolute; inset:0; pointer-events:none}
  #rails i{
    position:absolute; width:1px; display:block;
    background:color-mix(in srgb, var(--g-fg) 12%, transparent);
  }
  #rails i.up{
    width:2px; border-radius:1px;
    background:color-mix(in srgb, var(--g-accent)
                         calc(var(--near) * 1%), transparent);
  }
  #path{
    position:sticky; top:calc(-1 * var(--g-doc-pady)); z-index:2;
    margin:calc(-1 * var(--g-doc-pady)) calc(-1 * var(--g-doc-padx)) 6px;
    padding:4px var(--g-doc-padx);
    background:var(--g-surface); border-bottom:1px solid var(--g-border);
    font-size:11px; color:var(--g-mute);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  /* TEXT MIXES TOWARD THE MUTED INK, never toward nothing: a crumb at a fifth of
     the accent over transparent is a crumb nobody can read. */
  #path span{color:color-mix(in srgb, var(--g-accent) calc(var(--near) * 1%),
                             var(--g-mute))}
  #path b{font-weight:600; color:var(--g-accent)}
  #path s{text-decoration:none; padding:0 5px; opacity:.6}
</style>
</head>
<body>
  <h1>G · the ancestry, drawn and named
    <small>one ramp, two readings: a rail per block and the same chain in words</small></h1>
  <div id="mdoc" class="on"></div>
  <footer>
    <span><kbd>n</kbd><kbd>p</kbd> siblings · <kbd>f</kbd><kbd>b</kbd> in/out ·
      <kbd>t</kbd> theme</span>
    <span id="truth"></span>
  </footer>
<script src="rig.js"></script>
<script>
(function () {
  var layer, strip;
  // The ramp both readings share: full at point, a third shed per step out.
  var near = function (steps) { return Math.max(22, 100 - steps * 32); };
  var word = function (r) {
    if (r.el.classList.contains("d-comp")) return "list";
    var el = r.el.querySelector(".dp") || r.el;
    var t = el.textContent.replace(/^\s*-\s*/, "").trim();
    return t.length > 24 ? t.slice(0, 23) + "…" : t;
  };

  RIG.mount({
    setup: function (mdoc) {
      layer = document.createElement("div");
      layer.id = "rails";
      layer.setAttribute("aria-hidden", "true");
      mdoc.appendChild(layer);
      strip = document.createElement("div");
      strip.id = "path";
      // FIRST CHILD OR IT DOES NOT STICK: a sticky box sticks within the flow it
      // is in, and appended last it would ride the bottom.
      mdoc.insertBefore(strip, mdoc.firstChild);
    },
    paint: function (s) {
      // THE STRIP IS WRITTEN FIRST.  It sits in the pane's own flow, so filling
      // it moves every row below it; measuring rails before it is filled places
      // them a line high, which is what a page looked like until it was touched.
      strip.textContent = "";
      var crumbs = s.chain.filter(function (r) {
        return r.el.classList.contains("d-item") || r.el.classList.contains("d-comp");
      });
      if (!crumbs.length) strip.textContent = "paragraph";
      else crumbs.forEach(function (r, i) {
        if (i) strip.appendChild(document.createElement("s")).textContent = "›";
        var last = i === crumbs.length - 1;
        var span = document.createElement(last ? "b" : "span");
        span.textContent = word(r);
        // COUNTED FROM THE BLOCK, NOT FROM POINT: a rail is owned by the block
        // and `up' drops point, so a crumb counting from point would sit one
        // step dimmer than the rail of the very block it names.
        if (!last) span.style.setProperty("--near", near(crumbs.length - 2 - i));
        strip.appendChild(span);
      });

      var up = s.chain.slice(0, -1);              // the blocks point is inside
      layer.textContent = "";
      s.rails().forEach(function (r) {
        var i = document.createElement("i");
        var rank = up.indexOf(r.owner);
        var css = "left:" + r.x + "px;top:" + r.top + "px;height:" + r.height + "px";
        if (rank >= 0) {
          i.className = "up";
          css += ";--near:" + near(up.length - 1 - rank);
        }
        i.style.cssText = css;
        layer.appendChild(i);
      });
    },
  });
})();
</script>
</body>
</html>
