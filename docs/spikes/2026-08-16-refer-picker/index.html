<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refer picker — three rehearsals</title>
<style>
  /* THE SHELL ONLY.  Each rehearsal is its own file and brings its own CSS, so
     nothing here can leak into what is being judged. */
  :root{
    --mono:"JetBrains Mono","Fira Code","SF Mono",Menlo,Consolas,monospace;
    --bg:#FFFFFF; --fg:#000000; --mute:#667071; --border:#E3E6EA;
    --accent:#31769F; --surface:#F8F8FF;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --fg:#FFFFFF; --mute:#A4C2EB; --border:#2A2D3D;
      --accent:#4CB5F5; --surface:#21252B;
    }
  }
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 var(--mono);
    display:flex; flex-direction:column;
  }
  header{
    flex:none; border-bottom:1px solid var(--border); background:var(--surface);
  }
  h1{
    margin:0; padding:10px 20px 0; font-size:13px; font-weight:600;
    letter-spacing:.02em;
  }
  h1 small{font-weight:400; color:var(--mute); margin-left:8px}
  nav{display:flex; gap:0; flex-wrap:wrap; padding:0 20px}
  nav a{
    font-size:12px; color:var(--mute); text-decoration:none;
    border-bottom:2px solid transparent; padding:10px 14px;
  }
  nav a:hover{color:var(--fg)}
  nav a[aria-current="page"]{color:var(--fg); border-bottom-color:var(--accent)}
  nav a:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
  p.note{
    margin:0; padding:8px 20px; font-size:11px; color:var(--mute);
    border-bottom:1px solid var(--border); max-width:100ch;
  }
  p.note code,p.note kbd{font-size:11px}
  /* Each rehearsal runs in its OWN document: no id can collide, no stylesheet
     can reach another, and every file stays independently openable. */
  iframe{flex:1 1 auto; width:100%; border:0; display:block; min-height:0}
</style>
</head>
<body>
  <header>
    <h1>Refer picker <small>three rehearsals of <code>@</code> in the materialize sheet</small></h1>
    <nav id="tabs" aria-label="rehearsals">
      <a href="#a" data-src="a-modal.html">A · modal picker</a>
      <a href="#b" data-src="b-inline.html">B · inline completion</a>
      <a href="#c" data-src="c-table.html">C · inline table-view</a>
    </nav>
  </header>
  <p class="note" id="note"></p>
  <iframe id="stage" title="rehearsal"></iframe>

<script>
(() => {
  "use strict";
  const NOTE = {
    a: "A <code>.pop-band</code> over the veil, the way the sheet's other popups raise. "
     + "Focus moves into the picker; the pane is covered while you choose.",
    b: "An editor's completion. The list hangs under the caret and the pane NEVER loses "
     + "the keyboard — the query is the text you are typing, sitting in the prose.",
    c: "The table itself, shrunk: the config's <code>views.default</code> already applied, "
     + "the same four columns and badge hues, <kbd>/</kbd> to filter, <kbd>RET</kbd> to choose. "
     + "<code>marks</code>, <code>flags</code> and <code>actions</code> are table-view's own "
     + "mount options and the picker ships all three off.",
  };
  const tabs = [...document.querySelectorAll("#tabs a")];
  const stage = document.getElementById("stage");
  const note = document.getElementById("note");

  function show(key) {
    const tab = tabs.find((t) => t.hash === "#" + key) || tabs[0];
    for (const t of tabs) {
      if (t === tab) t.setAttribute("aria-current", "page");
      else t.removeAttribute("aria-current");
    }
    note.innerHTML = NOTE[tab.hash.slice(1)] || "";
    const src = tab.dataset.src;
    if (stage.getAttribute("src") !== src) stage.setAttribute("src", src);
    // The rehearsal wants the keyboard the moment it is on show.
    stage.addEventListener("load", () => {
      try { stage.contentWindow.focus(); } catch (e) { /* another origin */ }
    }, { once: true });
  }

  addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1) || "a");
})();
</script>
</body>
</html>
