<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · spine</title>
<link rel="stylesheet" href="pane.css">
<style>
  /* ONE UNBROKEN SPINE PER BLOCK, under the headline's own star, from its
     first row to its last: the block is one thing and its mark is one thing.
     The per-row bars go; the list keeps its elbows. */
  .lvl-top:not(.d-head):not(.d-comp)::before,
  .lvl-top.d-drawer::before{display:none}
  #rails{position:absolute; inset:0; pointer-events:none}
  #rails i{position:absolute; display:block; width:1px; border-radius:1px;
    background:var(--bar)}
</style>
</head>
<body>
  <h1>C · spine
    <small>one bar per block, under its own star</small></h1>
  <div id="mdoc" class="on"></div>
  <footer>
    <span><kbd>n</kbd><kbd>p</kbd> siblings · <kbd>f</kbd><kbd>b</kbd> in/out ·
      <kbd>TAB</kbd> fold · <kbd>t</kbd> theme · <kbd>d</kbd> flag</span>
    <span id="truth"></span>
  </footer>
<script src="rig.js"></script>
<script>
(function () {
  var layer;
  RIG.mount({
    setup: function (mdoc) {
      layer = document.createElement("div");
      layer.id = "rails";
      layer.setAttribute("aria-hidden", "true");
      mdoc.appendChild(layer);
    },
    paint: function (s) {
      layer.textContent = "";
      s.spans().forEach(function (sp) {
        var lit = s.chain.indexOf(sp.owner) >= 0;
        var bad = sp.owner.el.classList.contains("dfl");
        var i = document.createElement("i");
        i.style.cssText = "left:" + sp.x + "px;top:" + sp.top
          + "px;height:" + sp.height + "px;--bar:"
          + (bad ? "var(--g-bad)" : lit ? "var(--g-fg)" : "var(--g-point-off)");
        layer.appendChild(i);
      });
    },
  });
})();
</script>
</body>
</html>
