<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D · frozen always</title>
<link rel="stylesheet" href="pane.css">
<style>
  /* D — SIZED ONCE, AND NEVER AGAIN.

     The measure runs at mount, off the header and the widest value the table
     then holds, and the answer is written in px and left there.  No open
     re-measures, no close re-fits, no upsert grows anything.  Long values
     clip and ellipsize in every row, edit or not.

     There is nothing to freeze at an open because nothing was ever fluid, so
     `freezeColumns()' has no caller here — which is the tab's whole claim:
     the cheapest way to stop a column moving during an edit is to stop it
     moving at all.

     WHAT IT COSTS, and press `a' to see it: a row that ARRIVES later with a
     longer tag run than anything at mount gets the `…' and keeps it.  The
     column will not widen for it, today or ever. */
</style>
</head>
<body>
  <h1>D · frozen always
    <small>sized once at mount, never from content again — an edit changes nothing</small></h1>
  <div id="stage">
    <div id="frame">
      <div class="tv-bar"><input id="filter" class="tv-filter" readonly></div>
      <div class="tv-chips" id="chips"></div>
      <div id="tablewrap"></div>
    </div>
  </div>
  <span id="fzmeasure"></span>
  <footer>
    <span class="keys"><kbd>n</kbd><kbd>p</kbd> a row ·
      <kbd>f</kbd><kbd>b</kbd> (arrows) a column ·
      <kbd>RET</kbd> opens the cell ·
      <kbd>+</kbd> a draft under point ·
      <kbd>TAB</kbd><kbd>S-TAB</kbd> walk the draft ·
      <kbd>RET</kbd> captures · <kbd>ESC</kbd> drops it ·
      <kbd>a</kbd> a row arrives · <kbd>g</kbd> the ruler · <kbd>~</kbd> theme</span>
    <span id="state"></span>
    <span id="truth"></span>
    <span id="says"></span>
  </footer>

<script src="rig.js"></script>
<script>RIG.mount({ mode: "always" });</script>
</body>
</html>
